pre-commit:
  parallel: true
  jobs:
    - name: gofumpt
      glob: "*.go"
      run: make fmt-check
    - name: golangci-lint
      glob: "*.go"
      run: make lint
    - name: zizmor
      glob: ".github/workflows/*.{yml,yaml}"
      run: make zizmor

pre-push:
  jobs:
    - name: test
      run: make test

commit-msg:
  jobs:
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}
