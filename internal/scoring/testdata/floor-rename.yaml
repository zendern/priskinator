name: a floor applies to the old path of a rename
description: Moving a migration out of db/migrations is still a change to it.
change:
  files:
  - path: db/old/0001_init.sql
    old_path: db/migrations/0001_init.sql
    status: renamed
policy:
  version: 1
  scoring:
    floors:
    - description: Database migrations
      paths:
      - "db/migrations/**"
      risk: high
expect:
  risk: high
