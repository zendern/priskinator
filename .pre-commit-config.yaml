# Git hooks, run by prek (https://prek.j178.dev), a faster drop-in for
# pre-commit. `prek install` sets up every hook type listed below.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

# Named tier so the shared hook block (identical across repos) can say
# `priority: checks`; the local hooks' priority 10 is the same tier.
priorities:
  checks: 10

repos:
  # Built into prek: no download, no network.
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Conventional Commits check on the commit message. Remote hooks are frozen to
  # a commit SHA with the tag in a comment (`prek autoupdate --freeze`).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Same commands CI runs, through the Taskfile, so tool versions stay pinned in
  # one place. Hooks with the same priority run in parallel.
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        entry: task fmt-check
        language: system
        types: [go]
        pass_filenames: false
        priority: 10
      - id: golangci-lint
        name: golangci-lint
        entry: task lint
        language: system
        types: [go]
        pass_filenames: false
        priority: 10
      - id: go-test
        name: go test with coverage thresholds
        entry: task cover
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

  # Audits the workflows. v1.32.0 is the first zizmor that reads the workflow
  # lockfile (.github/workflows/actions.lock), so tag refs pass. GH_TOKEN turns
  # on the online audits; without it zizmor runs the offline ones only.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        priority: checks

  # Shared hooks, same block in every repo (https://github.com/zendern/pre-commit-hooks).
  - repo: https://github.com/zendern/pre-commit-hooks
    rev: cb3feef6aa5b1864d521e8bc84acc35391146974 # frozen: v1.3.0
    hooks:
      - id: gh-actions-lock-verify-local
        priority: checks
      - id: gh-actions-lock-verify
      - id: no-latest-runners
        priority: checks
      - id: require-timeouts
        priority: checks
      - id: require-runner-arch
        priority: checks
        args: [--arch=arm64]
