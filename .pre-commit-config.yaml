# Git hooks, run by prek (https://prek.j178.dev), a faster drop-in for
# pre-commit. `prek install` sets up every hook type listed below.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

# Named tier so the shared hook block (identical across repos) can say
# `priority: checks`; the local hooks' priority 10 is the same tier.
priorities:
  checks: 10

repos:
  # Built into prek: no download, no network.
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Conventional Commits check on the commit message. Remote hooks are frozen to
  # a commit SHA with the tag in a comment (`prek autoupdate --freeze`).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Renovate ignores an invalid config without failing, so validate it here.
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: f62507af2294bef36e59700281e3459a3d30ac74 # frozen: 44.155.8
    hooks:
      - id: renovate-config-validator
        args: [--strict]
        priority: 10

  # GitHub Actions security audit of workflows, actions, and this file. prek
  # installs zizmor itself at the version this rev pins. It runs offline unless
  # GH_TOKEN is set, as in CI, which turns on the online audits.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: d25b2b1dc80689fb633f21f6978bba69871181d3 # frozen: v1.31.0
    hooks:
      - id: zizmor
        priority: 10

  # Same commands CI runs, through the Taskfile, so tool versions stay pinned in
  # one place. Hooks with the same priority run in parallel.
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        entry: task fmt-check
        language: system
        types: [go]
        pass_filenames: false
        priority: 10
      - id: golangci-lint
        name: golangci-lint
        entry: task lint
        language: system
        types: [go]
        pass_filenames: false
        priority: 10
      # Go files too: adding or dropping an import can leave go.mod untidy.
      - id: go-mod-tidy
        name: go mod tidy
        entry: task tidy-check
        language: system
        files: (\.go|(^|/)go\.(mod|sum))$
        pass_filenames: false
        priority: 10
      - id: go-test
        name: go test with coverage thresholds
        entry: task cover
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

  # Shared hooks, same block in every repo (https://github.com/zendern/pre-commit-hooks).
  - repo: https://github.com/zendern/pre-commit-hooks
    rev: 8a9cb278d816e7ea06031a98aa3d357d6d4c6705  # frozen: v1.0.0
    hooks:
      - id: no-latest-runners
        priority: checks
