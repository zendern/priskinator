# Coverage gate for `task cover` (https://github.com/vladopajic/go-test-coverage).
# Thresholds are 95% everywhere (set 2026-10-15 at a 98.7% total; the lowest
# file, internal/policy/policy.go at 95.2%, misses only a panic on embedded
# defaults), so a change that adds untested code fails instead of slowly lowering
# the average. Lowering one, or excluding a path, needs a reason in the PR.
profile: coverage.out

threshold:
  file: 95
  package: 95
  total: 95

# Per-path overrides, for example a thin main that only wires flags:
# override:
#   - path: ^cmd/priskinator$
#     threshold: 60

# Each excluded path needs a reason here.
exclude:
  paths:
    # Only main: it hands os.Args and the standard streams to run and exits.
    # run holds the logic and is tested directly; a unit test cannot call
    # main without exiting the test binary.
    - ^cmd/priskinator/main\.go$
