name: merged

# Runs when a PR merges into main. ci.yml no longer runs on push to main (every
# job bills a rounded-up minute), so this decides whether the merge needs
# testing. If the merge commit's tree is identical to the PR head's tree and the
# ci.yml gate (workflow-summary) passed on that head, main holds exactly the
# content that was tested and the suite is skipped. Otherwise (main moved under
# the PR) the merge commit is re-tested through ci.yml. A release job will be
# attached here later, after the test job. Branch protection isn't available on
# this plan, so a direct push to main gets neither tests nor this workflow.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  tree-check:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      # Checks ci.yml's workflow-summary gate on the PR head.
      - id: tree
        uses: zendern/gha-shared/tree-check@821b6ab4f9e3451ceb24092940122691a96573e1 # v1.0.0
        with:
          merge-sha: ${{ github.event.pull_request.merge_commit_sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  test:
    needs:
      - tree-check
    if: ${{ needs.tree-check.outputs.tested == 'false' }}
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
