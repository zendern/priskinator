name: priskinator

# priskinator judges its own pull requests. The verdict job reports neutral: it
# passes whatever the verdict and fails only when the engine can't be built. The
# verdict goes to the job summary, and the verdict files are kept as an artifact
# for calibration (ADR 0013 phase 1).
#
# The comment job also posts the verdict as one PR comment and edits it on each
# push (a step toward phase 2). Set the repository variable
# PRISKINATOR_PR_COMMENT to "off" to keep the run silent. It only runs for PRs
# from this repository: a fork's token can't write comments, and that waits for
# the GitHub App (ADR 0005). It checks out nothing, so no PR code runs with the
# write token.
#
# The engine is built from the PR's merge base when that commit has the
# evaluate command, so a PR can't change the code that judges it. The verdict
# script is taken from the merge base the same way. The workflow file itself
# comes from the PR (pull_request runs the PR's copy); with a read-only token,
# no secrets and no verdict that gates anything, that is acceptable until the
# check is moved to the GitHub App in phase 3 (ADR 0005).
on:
  pull_request:
    # `edited` covers the retarget of a stacked PR when the PR below merges.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

concurrency:
  # A title or body edit skips the job, so it gets a unique group and can't
  # cancel a real run in progress.
  group: priskinator-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  verdict:
    name: priskinator verdict
    # Skip drafts, and `edited` events that did not retarget the PR.
    if: ${{ !github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Judge the commit that was pushed, not GitHub's merge ref.
          ref: ${{ github.event.pull_request.head.sha }}
          # The merge base and the base-side engine need the history.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Evaluate the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          script=$RUNNER_TEMP/priskinator-verdict.sh
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          if ! git show "$merge_base:scripts/priskinator-verdict.sh" >"$script" 2>/dev/null; then
            cp scripts/priskinator-verdict.sh "$script"
          fi
          bash "$script" "$BASE_SHA" "$RUNNER_TEMP/verdict"
      - name: Report the verdict
        if: ${{ !cancelled() }}
        run: |
          out=$RUNNER_TEMP/verdict
          [ -f "$out/engine.json" ] || { echo "::error::the engine did not run"; exit 1; }
          from=$(jq -r .engineFrom "$out/engine.json")
          commit=$(jq -r .engineCommit "$out/engine.json")
          code=$(jq -r .exitCode "$out/engine.json")
          {
            echo "## priskinator verdict (report-only)"
            echo
            echo "Engine built from the $from commit \`${commit:0:12}\`. Evaluate exited $code."
            echo
            echo '```text'
            cat "$out/verdict.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$out/verdict.txt"
          if [ "$code" != 0 ]; then
            echo "::warning::priskinator could not evaluate this PR (exit $code); see the job summary"
          fi
          if [ "$from" = head ]; then
            echo "::notice::the merge base has no evaluate command, so the engine was built from this PR"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: priskinator-verdict
          path: ${{ runner.temp }}/verdict/
          if-no-files-found: ignore
          retention-days: 90

  comment:
    name: priskinator comment
    needs: verdict
    if: >-
      ${{ !cancelled() && needs.verdict.result == 'success' &&
      vars.PRISKINATOR_PR_COMMENT != 'off' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: priskinator-verdict
          path: ${{ runner.temp }}/verdict
      - name: Post or update the verdict comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          dir=$RUNNER_TEMP/verdict
          if [ ! -f "$dir/verdict.md" ]; then
            echo "::notice::the engine predates the Markdown verdict, so no comment"
            exit 0
          fi
          marker='<!-- priskinator:verdict -->'
          commit=$(jq -r .engineCommit "$dir/engine.json")
          body=$RUNNER_TEMP/comment.md
          {
            echo "$marker"
            echo "## priskinator"
            echo
            # A comment holds at most 65536 characters; the verdict is far
            # smaller unless a change has thousands of reasons.
            head -c 60000 "$dir/verdict.md"
            echo
            echo "<sub>Report-only: this verdict doesn't gate the merge. Engine \`${commit:0:12}\`, [run]($RUN_URL).</sub>"
          } >"$body"
          # The first earlier comment of ours, if any. Kept out of a pipe to
          # head, which would fail the step with SIGPIPE under pipefail.
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F "body=@$body" >/dev/null
          fi
