# Mutation testing with gremlins (https://gremlins.dev), run by `task mutate`
# (whole module) and `task mutate-diff` (lines changed since a base). Both fail
# when a threshold is missed.
unleash:
  # Efficacy: killed / (killed + lived). Mutant coverage: mutants some test
  # reaches / all mutants. scripts/gremlins.sh also fails when more than 2% of
  # mutants time out, since gremlins leaves those out of efficacy.
  # gremlins can't see coverage on `case` expressions (Go's coverage profile
  # has no statement for them), so tagless switches are banned by a lint rule
  # in tools/lint/rules.go.
  threshold:
    efficacy: 95
    mutant-coverage: 95
  # The per-mutant timeout is the plain test run's time times this coefficient.
  # Low values report slow-but-killed mutants as TIMED OUT under parallel load,
  # which hides results: at 10, a run on internal/policy alone timed out 52 of
  # 168 mutants; at 30 none time out.
  timeout-coefficient: 30
